name: Fabrication

on:
  push:
    branches:
      - main
    tags:
      - v*
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '.github/workflows/*'
      - 'jlcpcb/*'
      - 'enclosure/**'
  pull_request:
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '.github/workflows/*'
      - 'jlcpcb/*'
      - 'enclosure/**'

env:
  KIKIT: docker run --rm -v $PWD:/pcb -w /pcb --user $UID:$GROUPS yaqwsx/kikit:v1.8.1-v9
  schema: SmartishMiniLED.kicad_sch
  board: SmartishMiniLED.kicad_pcb
  dir: output
  config: kibot.yml

jobs:
# checks
  ERC:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: INTI-CMNB/KiBot@v2_k9
        with:
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          config: ${{ env.config }}
          skip: drc
          targets: __NONE__

  DRC:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: INTI-CMNB/KiBot@v2_k9
        with:
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          config: ${{ env.config }}
          skip: erc
          targets: __NONE__

# documentation
  docs:
    runs-on: ubuntu-latest
    needs: [ ERC, DRC ]

    steps:
      - uses: actions/checkout@v7

      - uses: INTI-CMNB/KiBot@v2_k9
        with:
          install3D: YES
          schema: ${{ env.schema }}
          board: ${{ env.board }}
          config: ${{ env.config }}
          dir: ${{ env.dir }}
          skip: erc,drc
          targets: ibom.html octopart.csv schematic.pdf schematic.svg board_top.pdf board_bottom.pdf model.step

      - uses: actions/upload-artifact@v7
        if: ${{success()}}
        with:
          name: ${{github.event.repository.name}}_docs
          if-no-files-found: error
          path: |
            ${{env.dir}}/docs/**
            ${{env.dir}}/cad/**
            !${{env.dir}}/**/*.ogv
            !${{env.dir}}/**/*.log

  fabrications:
    name: Fabrication
    runs-on: ubuntu-latest
    needs: [ ERC, DRC ]

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: SmartishMiniLED
            schematic: SmartishMiniLED.kicad_sch
            board: SmartishMiniLED.kicad_pcb
    steps:
    - uses: actions/checkout@v7

    - name: Export JLCPCB fabrication files
      run: |
        # --no-drc: this job already needs [ ERC, DRC ], which run the same
        # check with the project's DRC exclusions (kibot.yml preflight.drc.filters)
        # applied. kikit's own internal DRC has no such exclusion mechanism -
        # it's a plain pass/fail - so it would otherwise re-fail on the J1
        # false positive that's already accepted upstream.
        ${{ env.KIKIT }} fab jlcpcb --no-drc --assembly --schematic ${{ matrix.schematic }} --ignore J2,P1,P2,J3,U5 ${{ matrix.board }} ${{ matrix.name }}

    - name: upload results
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.name }}
        path: |
          ${{ matrix.name }}/*.zip
          ${{ matrix.name }}/*.csv

  enclosure:
    name: Enclosure
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install OpenSCAD
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends openscad

    - name: Check clearances
      run: ./enclosure/build.sh --check

    - name: Render STLs
      run: ./enclosure/build.sh

    - name: upload results
      uses: actions/upload-artifact@v4
      with:
        name: ${{github.event.repository.name}}_enclosure
        if-no-files-found: error
        path: enclosure/stl/*.stl

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: 
      - docs
      - fabrications

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
    - name: Download the built assets
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Package up the combined assets
      run: |
        find artifacts
        version=${GITHUB_REF_NAME}
        for asset in SmartishMiniLED
        do
          for file in gerbers.zip bom.csv pos.csv
          do
            name=$(cut -d'.' -f1 <<< $file)
            ext=$(cut -d'.' -f2 <<< $file)
            mv artifacts/$asset/$file artifacts/$asset-$name-$version.$ext
          done
          rm -rf artifacts/$asset
        done
        mv artifacts/SmartishMiniLED_docs/docs/SmartishMiniLED-schematic.pdf artifacts/SmartishMiniLED-schematic-$version.pdf
        mv artifacts/SmartishMiniLED_docs/cad/SmartishMiniLED.step artifacts/SmartishMiniLED-$version.step
        for asset in SmartishMiniLED_docs
        do
          rm -rf artifacts/$asset
        done
        find artifacts

    - name: Upload assets to latest release
      uses: softprops/action-gh-release@v3
      with:
        prerelease: ${{ contains(github.ref, '-rc') }}
        files: |
          artifacts/*.zip
          artifacts/*.csv
          artifacts/*.pdf
          artifacts/*.step
